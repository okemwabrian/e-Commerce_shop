spring.application.name=shop
server.port=${PORT:8080}
# ---- Database ----
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/shopdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1417}}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# ---- Security ----
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-deployment-0123456789}
app.jwt.expiration-ms=86400000
app.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:admin}
app.cors.allowed-origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000}}
# ---- Shop settings ----
shop.seed.enabled=${SEED_ENABLED:true}
shop.shipping-fee=300
shop.free-shipping-threshold=5000
shop.whatsapp-number=${WHATSAPP_NUMBER:254112549445}
shop.support-email=${SUPPORT_EMAIL:support@myshop.com}
shop.support-phone=${SUPPORT_PHONE:+254700000000}
shop.support-hours=Mon-Sat, 8:00 to 18:00 (EAT)
shop.frontend-url=${FRONTEND_URL:http://localhost:5173}
