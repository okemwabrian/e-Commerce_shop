spring.application.name=shop
server.port=8080
# ---- Database (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.username=postgres
spring.datasource.password=1417
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ---- Security  ----
app.jwt.secret=replace-this-with-a-long-random-secret-of-at-least-32-characters
app.jwt.expiration-ms=86400000
app.google.client-id=YOUR_CLIENT_ID.apps.googleusercontent.com
app.admin.email=admin@shop.com
app.admin.password=Admin@12345
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# ---- Shop settings ----
shop.seed.enabled=true
shop.shipping-fee=300
shop.free-shipping-threshold=5000
shop.whatsapp-number=254112549445
shop.support-email=support@myshop.com
shop.support-phone=+254112549445
shop.support-hours=Mon-Sat, 8:00 to 18:00 (EAT)
shop.frontend-url=http://localhost:5173
